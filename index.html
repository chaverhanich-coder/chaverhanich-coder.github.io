<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rabbi's Care Log</title>
<meta name="theme-color" content="#f4f6f8">
<link rel="manifest" href="manifest.json">
<style>
  :root{--ink:#15202b;--mut:#5b6b7b;--line:#e3e8ee;--bg:#f4f6f8;--card:#fff;--red:#c0392b;--amber:#b7791f;--green:#1e7f4f;--blue:#1d4ed8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.35;padding-bottom:76px}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
  header h1{font-size:19px;margin:0;flex:1;font-weight:700}
  .aidechip{background:var(--blue);color:#fff;border:none;border-radius:20px;padding:8px 14px;font-size:15px;font-weight:600;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding:12px 12px 0;max-width:640px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .taskcard{display:flex;flex-direction:column;gap:8px}
  .taskrow{display:flex;align-items:center;justify-content:space-between}
  .taskname{font-size:20px;font-weight:700}
  .every{color:var(--mut);font-size:14px}
  .status{font-size:16px;font-weight:600}
  .st-green{color:var(--green)}.st-amber{color:var(--amber)}.st-red{color:var(--red)}
  .last{color:var(--mut);font-size:14px}
  .bigbtn{display:block;width:100%;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:18px;font-weight:700;padding:14px;margin-top:2px}
  .bigbtn:active{opacity:.85}
  .overdue .bigbtn{background:var(--red)}
  .empty{color:var(--mut);text-align:center;padding:28px 10px;font-size:16px}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:none;background:none;font-size:15px;font-weight:600;color:var(--mut);padding:14px 0}
  nav button.on{color:var(--blue);border-top:3px solid var(--blue);padding-top:11px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px 26px;max-height:92vh;overflow-y:auto}
  .sheet h2{margin:0 0 4px;font-size:22px}
  .sheet .sub{color:var(--mut);font-size:14px;margin-bottom:12px}
  .frow{margin-bottom:12px}
  .frow label{display:block;font-weight:600;font-size:15px;margin-bottom:5px}
  .frow input[type=number],.frow input[type=text],.frow textarea{width:100%;font-size:17px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .frow textarea{min-height:64px;resize:vertical}
  .medcheck{display:flex;flex-wrap:wrap;gap:8px}
  .medcheck label{display:flex;align-items:center;gap:6px;background:#eef2f7;border:1px solid var(--line);border-radius:20px;padding:8px 13px;font-size:15px;font-weight:500;margin:0}
  .medcheck input{width:20px;height:20px}
  .medtime{color:var(--mut);font-weight:700;font-size:12px;margin-left:2px}
  .photobtn{display:block;width:100%;border:2px dashed var(--mut);border-radius:12px;background:#f8fafc;color:var(--mut);font-size:16px;font-weight:600;padding:18px;text-align:center}
  .photoPrev{width:100%;border-radius:12px;margin-top:8px;display:block}
  .btnrow{display:flex;gap:10px;margin-top:14px}
  .btnrow button{flex:1;border:none;border-radius:12px;font-size:17px;font-weight:700;padding:14px}
  .savebtn{background:var(--green);color:#fff}
  .cancelbtn{background:#e9edf2;color:var(--ink)}
  .dayhead{font-weight:700;font-size:15px;color:var(--mut);margin:18px 4px 6px;text-transform:uppercase;letter-spacing:.4px}
  .entry{display:flex;gap:12px;align-items:flex-start}
  .entry .thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:#dde3ea}
  .entry .ebody{flex:1;min-width:0}
  .entry .etime{font-weight:700;font-size:16px}
  .entry .etask{font-size:15px;color:var(--blue);font-weight:600}
  .entry .edetail{font-size:15px;color:var(--ink)}
  .entry .enotes{font-size:15px;color:var(--mut)}
  .del{background:none;border:none;color:var(--red);font-size:20px;padding:4px;flex:none}
  .chiprow{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;font-size:15px;font-weight:600;color:var(--mut);flex:none}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .settings .frow input,.settings .frow textarea{font-size:16px}
  .linkbtn{background:none;border:none;color:var(--blue);font-size:16px;font-weight:600;padding:10px 0;text-align:left;width:100%}
  .danger{color:var(--red)}
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:flex;align-items:center;justify-content:center}
  .viewer img{max-width:100%;max-height:100%}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .banner{background:#fff7e0;border:1px solid #ecd9a0;border-radius:12px;padding:10px 14px;font-size:14px;color:#7a5b12;margin-bottom:12px}
  .calwrap{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .calhead b{font-size:16px}
  .calnav{background:none;border:none;color:var(--blue);font-size:22px;padding:2px 12px;font-weight:700}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .calwd{font-size:11px;color:var(--mut);font-weight:700;padding:2px 0}
  .cald{position:relative;padding:8px 0;font-size:14px;border-radius:8px;border:none;background:none;color:var(--ink)}
  .cald.blank{visibility:hidden}
  .cald.sel{background:var(--blue);color:#fff;font-weight:700}
  .cald.today{box-shadow:inset 0 0 0 2px var(--blue)}
  .cald .dot{display:none;position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--amber)}
  .cald.hasdot .dot{display:block}
  .cald.sel .dot{background:#fff}
  .sitem{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .sitem:last-child{border-bottom:none}
  .stime{font-weight:700;font-size:16px;flex:none;width:74px}
  .sbody{flex:1;min-width:0}
  .slabel{font-weight:600;font-size:16px}
  .snotes{font-size:14px;color:var(--mut)}
  .stag{display:inline-block;font-size:11px;font-weight:700;color:var(--blue);background:#e8edfb;border-radius:8px;padding:2px 6px;margin-left:6px;vertical-align:middle}
  .checkrow{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
  .checkrow input{width:20px;height:20px}
</style>
</head>
<body>
<header>
  <h1>Rabbi's Care Log</h1>
  <button class="aidechip" id="aideChip">Pick aide</button>
</header>
<main>
  <div id="viewLog">
    <div class="banner" id="remindBanner">Keep this page open so it can remind you when something is due. For the best feel, add it to your home screen.</div>
    <div id="dashboard"></div>
  </div>
  <div id="viewHistory" hidden>
    <div class="chiprow" id="hFilterTask"></div>
    <div class="chiprow" id="hFilterAide"></div>
    <div id="historyList"></div>
  </div>
  <div id="viewSchedule" hidden>
    <button class="bigbtn" id="addSched">Add to schedule</button>
    <div class="calwrap" id="calWrap"></div>
    <div id="schedList"></div>
  </div>
  <div id="viewSettings" hidden>
    <div class="card settings">
      <div class="frow"><label>Aides (one per line)</label><textarea id="setAides" rows="3"></textarea></div>
      <div class="frow"><label>Medications (one per line, add a time like @ 8am)</label><textarea id="setMeds" rows="4" placeholder="e.g. riluzole 50mg @ 8am"></textarea></div>
      <div class="frow"><label>Vitals interval (minutes)</label><input type="number" id="setIvVitals" inputmode="numeric"></div>
      <div class="frow"><label>Blood pressure interval (minutes)</label><input type="number" id="setIvBp" inputmode="numeric"></div>
      <div class="frow"><label>Medication interval (minutes)</label><input type="number" id="setIvMeds" inputmode="numeric"></div>
      <button class="bigbtn" id="saveSettings">Save settings</button>
      <button class="linkbtn" id="enableReminders">Enable reminders on this phone</button>
      <button class="linkbtn" id="shareSummary">Share today's summary</button>
      <button class="linkbtn" id="copySummary">Copy today's summary</button>
      <button class="linkbtn" id="exportData">Back up all data (download file)</button>
      <button class="linkbtn danger" id="wipeData">Delete everything on this phone</button>
      <p style="color:var(--mut);font-size:13px">This log lives only on this phone. Back it up now and then with the download button.</p>
    </div>
  </div>
</main>
<nav>
  <button id="tabLog" class="on">Log</button>
  <button id="tabHistory">History</button>
  <button id="tabSchedule">Schedule</button>
  <button id="tabSettings">Settings</button>
</nav>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <h2 id="fTitle">Log</h2>
    <div class="sub" id="fSub"></div>
    <div id="fFields"></div>
    <div class="frow"><label>Notes (optional)</label><textarea id="fNotes" placeholder="Anything worth noting"></textarea></div>
    <div class="frow">
      <label id="fPhotoLbl">Photo (required)</label>
      <input type="file" accept="image/*" capture="environment" id="fPhoto" hidden>
      <button class="photobtn" id="fPhotoBtn">Take photo</button>
      <img class="photoPrev" id="fPhotoPrev" hidden alt="">
    </div>
    <div class="frow" id="fPhoto2Wrap" hidden>
      <label>Photo: temperature (required)</label>
      <input type="file" accept="image/*" capture="environment" id="fPhoto2" hidden>
      <button class="photobtn" id="fPhoto2Btn">Take photo</button>
      <img class="photoPrev" id="fPhoto2Prev" hidden alt="">
    </div>
    <div class="btnrow">
      <button class="cancelbtn" id="fCancel">Cancel</button>
      <button class="savebtn" id="fSave">Save entry</button>
    </div>
  </div>
</div>
<div class="modal" id="sModal" hidden>
  <div class="sheet">
    <h2>Add to schedule</h2>
    <div class="frow"><label>What</label><input type="text" id="sLabel" placeholder="e.g. Pulmonology appointment"></div>
    <div class="frow"><label>Time</label><input type="time" id="sTime"></div>
    <div class="frow"><label class="checkrow"><input type="checkbox" id="sDaily"> Every day</label></div>
    <div class="frow" id="sDateWrap"><label>Date</label><input type="date" id="sDate"></div>
    <div class="frow"><label>Notes (optional)</label><textarea id="sNotes" rows="2"></textarea></div>
    <div class="btnrow">
      <button class="cancelbtn" id="sCancel">Cancel</button>
      <button class="savebtn" id="sSave">Save</button>
    </div>
  </div>
</div>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
var TASKS=[{id:'vitals',label:'Vitals'},{id:'bp',label:'Blood pressure'},{id:'meds',label:'Medications'}];
var DEF={aide:'',aides:['Victor','Roel','Enzo','Other'],meds:[],sched:[],intervals:{vitals:20,bp:60,meds:120}};
var S=JSON.parse(localStorage.getItem('rcl_set')||'null')||JSON.parse(JSON.stringify(DEF));
if(S.meds&&S.meds.length&&typeof S.meds[0]==='string')S.meds=S.meds.map(parseMedLine);
function saveS(){localStorage.setItem('rcl_set',JSON.stringify(S));}
var entries=[];var db=null;var modalTask=null;var modalPhoto=null;var modalPhoto2=null;
var announced={vitals:false,bp:false,meds:false};
var fTask='all',fAide='all';
if(!S.sched)S.sched=[];var schedMonth=null;var schedSel=null;

function openDB(){return new Promise(function(res,rej){var r=indexedDB.open('rcl',1);r.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains('entries')){d.createObjectStore('entries',{keyPath:'ts'});}};r.onsuccess=function(e){db=e.target.result;res();};r.onerror=function(e){rej(e);};});}
function idbPut(v){return new Promise(function(res,rej){var t=db.transaction('entries','readwrite');t.objectStore('entries').put(v);t.oncomplete=res;t.onerror=function(){rej(t.error);};});}
function idbDel(k){return new Promise(function(res,rej){var t=db.transaction('entries','readwrite');t.objectStore('entries').delete(k);t.oncomplete=res;t.onerror=function(){rej(t.error);};});}
function loadEntries(){return new Promise(function(res,rej){var t=db.transaction('entries','readonly');var rq=t.objectStore('entries').getAll();rq.onsuccess=function(){entries=(rq.result||[]).sort(function(a,b){return b.ts-a.ts;});res();};rq.onerror=function(){rej(rq.error);};});}

function taskLabel(id){for(var i=0;i<TASKS.length;i++)if(TASKS[i].id===id)return TASKS[i].label;return id;}
function lastEntry(task){for(var i=0;i<entries.length;i++)if(entries[i].task===task)return entries[i];return null;}
function ago(ts){var s=Math.max(0,Date.now()-ts);var m=Math.floor(s/60000);if(m<1)return'just now';if(m<60)return m+'m ago';var h=Math.floor(m/60);return h+'h '+(m%60)+'m ago';}
function fmtTime(ts){return new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
function fmtDay(ts){return new Date(ts).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'});}
function fmt12(t){var p=t.split(':');var h=parseInt(p[0],10);var mi=p[1]||'00';var ap=h>=12?'pm':'am';var h12=h%12;if(h12===0)h12=12;return h12+':'+mi+' '+ap;}
function dstr(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function itemsOn(ds){var out=[];for(var i=0;i<S.sched.length;i++){var x=S.sched[i];if(x.rep==='daily'||x.d===ds)out.push(x);}return out;}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}

function taskState(task){var iv=(S.intervals[task]||60)*60000;var l=lastEntry(task);if(!l)return{cls:'st-green',main:'No log yet',sub:'',over:false,last:null};var el=Date.now()-l.ts;var leftm=Math.round((iv-el)/60000);
if(el>=iv)return{cls:'st-red',main:'OVERDUE by '+Math.round((el-iv)/60000)+'m',sub:'',over:true,last:l};
if(leftm<=2)return{cls:'st-amber',main:'Due now',sub:'',over:false,last:l};
return{cls:'st-green',main:leftm+'m left',sub:'',over:false,last:l};}

function renderDash(){var d=document.getElementById('dashboard');var h='';for(var i=0;i<TASKS.length;i++){var t=TASKS[i];var st=taskState(t.id);var l=st.last;var lastTxt=l?('Last: '+ago(l.ts)+' by '+(l.aide||'?')):'No entry yet';
var cls='card taskcard';if(st.over)cls+=' overdue';h+='<div class="'+cls+'">'
+'<div class="taskrow"><div><div class="taskname">'+t.label+'</div><div class="every">every '+(S.intervals[t.id]||60)+' min</div></div>'
+'<div class="status '+st.cls+'">'+st.main+'</div></div>'
+'<div class="last">'+lastTxt+'</div>'
+'<button class="bigbtn" data-task="'+t.id+'">Log '+t.label+'</button>'
+'</div>';}
d.innerHTML=h;var bs=d.querySelectorAll('button[data-task]');for(var j=0;j<bs.length;j++){(function(btn){btn.addEventListener('click',function(){openForm(btn.getAttribute('data-task'));});})(bs[j]);}}

function fieldRow(label,name,ph){return '<div class="frow"><label>'+label+'</label><input type="text" inputmode="decimal" id="fld_'+name+'" placeholder="'+(ph||'')+'"></div>';}

function openForm(task){modalTask=task;modalPhoto=null;modalPhoto2=null;document.getElementById('fPhotoLbl').textContent=task==='vitals'?'Photo: O2 & heart rate (required)':'Photo (required)';document.getElementById('fPhoto2Wrap').hidden=(task!=='vitals');
var f=document.getElementById('fFields');var h='';
if(task==='vitals'){h+=fieldRow('Pulse (bpm)','pulse');h+=fieldRow('Oxygen (%)','o2');h+=fieldRow('Temperature','temp');}
if(task==='bp'){h+=fieldRow('Systolic (top number)','sys');h+=fieldRow('Diastolic (bottom number)','dia');}
if(task==='meds'){var meds=S.meds||[];if(!meds.length){h+='<div class="frow" style="color:var(--mut)">No med list yet. Add medications in Settings.</div>';}
else{h+='<div class="frow"><label>Medications given</label><div class="medcheck">';for(var i=0;i<meds.length;i++){var mn=medName(meds[i]);var mt=medTime(meds[i]);h+='<label><input type="checkbox" class="medcb" value="'+mn.replace(/"/g,'&quot;')+'">'+esc(mn)+(mt?' <span class="medtime">'+esc(mt)+'</span>':'')+'</label>';}h+='</div></div>';}}
f.innerHTML=h;
document.getElementById('fTitle').textContent='Log '+taskLabel(task);
document.getElementById('fSub').textContent='By '+(S.aide||'no aide picked')+' · '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
var p=document.getElementById('fPhotoPrev');p.hidden=true;p.removeAttribute('src');
document.getElementById('fPhoto').value='';
document.getElementById('fPhotoBtn').textContent='Take photo';
var p2=document.getElementById('fPhoto2Prev');p2.hidden=true;p2.removeAttribute('src');
document.getElementById('fPhoto2').value='';
document.getElementById('fPhoto2Btn').textContent='Take photo';
document.getElementById('fNotes').value='';
document.getElementById('modal').hidden=false;}

function closeForm(){document.getElementById('modal').hidden=true;modalTask=null;modalPhoto=null;modalPhoto2=null;}

function pickPhoto(){document.getElementById('fPhoto').click();}
function onPhotoPicked(ev){var file=ev.target.files&&ev.target.files[0];if(!file)return;fileToDataURL(file).then(function(url){modalPhoto=url;var p=document.getElementById('fPhotoPrev');p.src=url;p.hidden=false;document.getElementById('fPhotoBtn').textContent='Retake photo';}).catch(function(){toast('Could not read that photo');});}
function pickPhoto2(){document.getElementById('fPhoto2').click();}
function onPhotoPicked2(ev){var file=ev.target.files&&ev.target.files[0];if(!file)return;fileToDataURL(file).then(function(url){modalPhoto2=url;var p=document.getElementById('fPhoto2Prev');p.src=url;p.hidden=false;document.getElementById('fPhoto2Btn').textContent='Retake photo';}).catch(function(){toast('Could not read that photo');});}
function medName(m){return (typeof m==='string')?m:(m.n||'');}
function medTime(m){return (typeof m==='string')?'':(m.t||'');}
function parseMedLine(x){var mm=x.match(/^(.*?)\s*@\s*(\d{1,2}(?::\d{2})?\s*(?:a\.?m\.?|p\.?m\.?))$/i);if(mm)return{n:mm[1].trim(),t:mm[2].replace(/\s+/g,'').toLowerCase()};return{n:x.trim(),t:''};}
function fileToDataURL(file){return new Promise(function(res,rej){var img=new Image();var url=URL.createObjectURL(file);img.onload=function(){try{var max=900;var w=img.width,h=img.height;var sc=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.6));}catch(e){rej(e);}};img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};img.src=url;});}

function saveEntry(){if(!modalTask)return;
if(!S.aide){closeForm();toast('Pick who is logging first');pickAide();return;}
if(!modalPhoto){toast('A photo is required for every entry');return;}
if(modalTask==='vitals'&&!modalPhoto2){toast('For vitals add the temperature photo too');return;}
var e={ts:Date.now(),task:modalTask,aide:S.aide,notes:document.getElementById('fNotes').value.trim(),photo:modalPhoto,photo2:(modalTask==='vitals'?modalPhoto2:null),data:{}};
if(modalTask==='vitals'){var p=document.getElementById('fld_pulse'),o=document.getElementById('fld_o2'),tp=document.getElementById('fld_temp');if(p&&p.value)e.data.pulse=p.value;if(o&&o.value)e.data.o2=o.value;if(tp&&tp.value)e.data.temp=tp.value;}
if(modalTask==='bp'){var s=document.getElementById('fld_sys'),d=document.getElementById('fld_dia');if(s&&s.value)e.data.sys=s.value;if(d&&d.value)e.data.dia=d.value;}
if(modalTask==='meds'){var cbs=document.querySelectorAll('.medcb:checked');var g=[];for(var i=0;i<cbs.length;i++)g.push(cbs[i].value);e.data.meds=g;}
idbPut(e).then(function(){announced[modalTask]=false;closeForm();return loadEntries();}).then(function(){renderDash();toast('Saved');}).catch(function(){toast('Could not save, try again');});}

function detailLine(e){var d=e.data||{};var bits=[];if(d.sys||d.dia)bits.push('BP '+(d.sys||'?')+'/'+(d.dia||'?'));if(d.pulse)bits.push('pulse '+d.pulse);if(d.o2)bits.push('O2 '+d.o2+'%');if(d.temp)bits.push('temp '+d.temp);if(d.meds&&d.meds.length)bits.push('gave: '+d.meds.join(', '));return bits.join(' · ');}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function bindChips(el,cb){var cs=el.querySelectorAll('.chip');for(var i=0;i<cs.length;i++){(function(c){c.addEventListener('click',function(){cb(c.getAttribute('data-v'));});})(cs[i]);}}
function showViewer(src){var v=document.getElementById('viewer');document.getElementById('viewerImg').src=src;v.hidden=false;v.onclick=function(){v.hidden=true;};}

function renderHistory(){var ft=document.getElementById('hFilterTask');var fa=document.getElementById('hFilterAide');
var tlabels=['all','vitals','bp','meds'];var alabels=['all'].concat(S.aides||[]);
function chipHtml(vals,cur){var h='';for(var i=0;i<vals.length;i++){var v=vals[i];var lbl=v==='all'?'All':taskLabel(v);h+='<button class="chip'+(v===cur?' on':'')+'" data-v="'+v+'">'+lbl+'</button>';}return h;}
ft.innerHTML=chipHtml(tlabels,fTask);fa.innerHTML=chipHtml(alabels,fAide);
bindChips(ft,function(v){fTask=v;renderHistory();});bindChips(fa,function(v){fAide=v;renderHistory();});
var list=document.getElementById('historyList');if(!entries.length){list.innerHTML='<div class="empty">Nothing logged yet.</div>';return;}
var h='';var lastDay='';
for(var i=0;i<entries.length;i++){var e=entries[i];
if(fTask!=='all'&&e.task!==fTask)continue;
if(fAide!=='all'&&e.aide!==fAide)continue;
var day=fmtDay(e.ts);
if(day!==lastDay){h+='<div class="dayhead">'+day+'</div>';lastDay=day;}
var det=detailLine(e);
var p1='<img class="thumb" src="'+e.photo+'" data-ts="'+e.ts+'" alt="">';var p2='';if(e.photo2)p2='<img class="thumb" src="'+e.photo2+'" alt="">';h+=p1+p2
+'<div class="ebody"><div class="etime">'+fmtTime(e.ts)+' · <span class="etask">'+taskLabel(e.task)+'</span> · '+e.aide+'</div>'
+(det?'<div class="edetail">'+det+'</div>':'')
+(e.notes?'<div class="enotes">'+esc(e.notes)+'</div>':'')
+'</div><button class="del" data-ts="'+e.ts+'">✕</button></div>';}
list.innerHTML=h;
var thumbs=list.querySelectorAll('img.thumb');for(var j=0;j<thumbs.length;j++){(function(th){th.addEventListener('click',function(){showViewer(th.src);});})(thumbs[j]);}
var dels=list.querySelectorAll('button.del');for(var k=0;k<dels.length;k++){(function(dl){dl.addEventListener('click',function(){var ts=Number(dl.getAttribute('data-ts'));if(confirm('Delete this entry?')){idbDel(ts).then(loadEntries).then(function(){renderDash();renderHistory();toast('Deleted');});}});})(dels[k]);}}

function todaySummary(){var now=new Date();var start=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();var es=entries.filter(function(e){return e.ts>=start;}).sort(function(a,b){return a.ts-b.ts;});if(!es.length)return null;
var out='Rabbi care log — '+now.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})+'\n';
for(var i=0;i<es.length;i++){var e=es[i];out+=fmtTime(e.ts)+' '+taskLabel(e.task)+' ('+e.aide+')';var det=detailLine(e);if(det)out+=' — '+det;if(e.notes)out+=' — '+e.notes;out+='\n';}
return out;}
function doShare(){var s=todaySummary();if(!s){toast('Nothing logged today yet');return;}if(navigator.share){navigator.share({text:s}).catch(function(){});}else{copyText(s);}}
function doCopy(){var s=todaySummary();if(!s){toast('Nothing logged today yet');return;}copyText(s);}
function copyText(s){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){toast('Summary copied');},function(){fallbackCopy(s);});}else fallbackCopy(s);}
function fallbackCopy(s){var ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Summary copied');}catch(e){toast('Copy failed');}document.body.removeChild(ta);}

function pickAide(){var names=(S.aides&&S.aides.length?S.aides:['Victor','Roel','Enzo']);var opts='';for(var i=0;i<names.length;i++)opts+='\n'+(i+1)+'. '+names[i];var pick=prompt('Who is logging?'+opts);if(pick===null)return;var n=parseInt(pick,10);if(n>=1&&n<=names.length){S.aide=names[n-1];}else if(pick.trim()){S.aide=pick.trim();}else return;saveS();renderChip();renderDash();}
function renderChip(){document.getElementById('aideChip').textContent=S.aide||'Pick aide';}

function saveSettings(){var a=document.getElementById('setAides').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
var m=document.getElementById('setMeds').value.split('\n').map(function(x){return x.trim();}).filter(Boolean).map(parseMedLine);
var iv={vitals:parseInt(document.getElementById('setIvVitals').value,10)||S.intervals.vitals,bp:parseInt(document.getElementById('setIvBp').value,10)||S.intervals.bp,meds:parseInt(document.getElementById('setIvMeds').value,10)||S.intervals.meds};
S.aides=a.length?a:S.aides;S.meds=m;S.intervals=iv;if(S.aide&&a.length&&a.indexOf(S.aide)<0)S.aide='';
saveS();renderChip();renderDash();fillSettings();toast('Settings saved');}
function fillSettings(){document.getElementById('setAides').value=(S.aides||[]).join('\n');document.getElementById('setMeds').value=(S.meds||[]).map(function(x){return medName(x)+(medTime(x)?' @ '+medTime(x):'');}).join('\n');document.getElementById('setIvVitals').value=S.intervals.vitals;document.getElementById('setIvBp').value=S.intervals.bp;document.getElementById('setIvMeds').value=S.intervals.meds;}

function exportData(){var blob=new Blob([JSON.stringify({settings:S,entries:entries},null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rabbi-care-log-backup.json';document.body.appendChild(a);a.click();document.body.removeChild(a);toast('Backup downloaded');}
function wipeData(){if(confirm('Delete every entry on this phone? This cannot be undone.')&&confirm('Really delete everything?')){var t=db.transaction('entries','readwrite');t.objectStore('entries').clear();t.oncomplete=function(){entries=[];renderDash();renderHistory();toast('All entries deleted');};}}

function enableReminders(){if(!('Notification'in window)){toast('This phone does not support reminders');return;}Notification.requestPermission().then(function(p){toast(p==='granted'?'Reminders on':'Reminders stayed off');});}
function checkDue(){for(var i=0;i<TASKS.length;i++){var t=TASKS[i];var iv=(S.intervals[t.id]||60)*60000;var l=lastEntry(t.id);var over=l&&(Date.now()-l.ts)>=iv;if(over&&!announced[t.id]){announced[t.id]=true;if(navigator.vibrate)navigator.vibrate([300,150,300]);if('Notification'in window&&Notification.permission==='granted'){try{new Notification(t.label+' is due');}catch(e){}}}else if(l&&!over){announced[t.id]=false;}}}

function renderSchedule(){
var wrap=document.getElementById('calWrap');
if(!schedMonth){var n=new Date();schedMonth=new Date(n.getFullYear(),n.getMonth(),1);}
if(!schedSel)schedSel=dstr(new Date());
var y=schedMonth.getFullYear(),m=schedMonth.getMonth();
var monthName=schedMonth.toLocaleDateString([],{month:'long',year:'numeric'});
var startDow=new Date(y,m,1).getDay();
var daysIn=new Date(y,m+1,0).getDate();
var g='';var wds=['S','M','T','W','T','F','S'];
for(var i=0;i<7;i++)g+='<div class="calwd">'+wds[i]+'</div>';
for(var b=0;b<startDow;b++)g+='<div class="cald blank"></div>';
for(var dnum=1;dnum<=daysIn;dnum++){
var ds=y+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+dnum).slice(-2);
var cls='cald';if(ds===dstr(new Date()))cls+=' today';if(ds===schedSel)cls+=' sel';
if(itemsOn(ds).length)cls+=' hasdot';
g+='<button class="'+cls+'" data-d="'+ds+'">'+dnum+'<span class="dot"></span></button>';}
wrap.innerHTML='<div class="calhead"><button class="calnav" id="calPrev">&lsaquo;</button><b>'+monthName+'</b><button class="calnav" id="calNext">&rsaquo;</button></div><div class="calgrid">'+g+'</div>';
document.getElementById('calPrev').addEventListener('click',function(){schedMonth=new Date(y,m-1,1);renderSchedule();});
document.getElementById('calNext').addEventListener('click',function(){schedMonth=new Date(y,m+1,1);renderSchedule();});
var dbs=wrap.querySelectorAll('button.cald');
for(var j=0;j<dbs.length;j++){(function(b2){b2.addEventListener('click',function(){schedSel=b2.getAttribute('data-d');renderSchedule();});})(dbs[j]);}
var list=document.getElementById('schedList');
var its=itemsOn(schedSel).slice().sort(function(a,c){return (a.t||'')<(c.t||'')?-1:1;});
var h='';var dd=new Date(schedSel+'T12:00');
h+='<div class="dayhead">'+dd.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})+'</div>';
if(!its.length)h+='<div class="empty">Nothing scheduled for this day.</div>';
for(var k=0;k<its.length;k++){var it=its[k];
h+='<div class="card sitem"><div class="stime">'+(it.t?fmt12(it.t):'')+'</div><div class="sbody"><div class="slabel">'+esc(it.label)+(it.rep==='daily'?'<span class="stag">daily</span>':'')+'</div>'+(it.notes?'<div class="snotes">'+esc(it.notes)+'</div>':'')+'</div><button class="del" data-sid="'+it.id+'">&#10005;</button></div>';}
var ups=S.sched.filter(function(x){return x.rep!=='daily'&&x.d>schedSel;}).sort(function(a,c){return (a.d+(a.t||''))<(c.d+(c.t||''))?-1:1;});
if(ups.length){h+='<div class="dayhead">Coming up</div>';
for(var u=0;u<ups.length;u++){var up=ups[u];var ud=new Date(up.d+'T12:00');
h+='<div class="card sitem"><div class="stime">'+ud.toLocaleDateString([],{month:'short',day:'numeric'})+'</div><div class="sbody"><div class="slabel">'+esc(up.label)+(up.t?' &middot; '+fmt12(up.t):'')+'</div>'+(up.notes?'<div class="snotes">'+esc(up.notes)+'</div>':'')+'</div><button class="del" data-sid="'+up.id+'">&#10005;</button></div>';}}
list.innerHTML=h;
var sd=list.querySelectorAll('button.del');
for(var q=0;q<sd.length;q++){(function(dl2){dl2.addEventListener('click',function(){var sid=Number(dl2.getAttribute('data-sid'));if(confirm('Remove this from the schedule?')){S.sched=S.sched.filter(function(x){return x.id!==sid;});saveS();renderSchedule();toast('Removed');}});})(sd[q]);}
}
function openSchedForm(){
document.getElementById('sLabel').value='';document.getElementById('sTime').value='';document.getElementById('sDaily').checked=false;document.getElementById('sNotes').value='';
document.getElementById('sDate').value=schedSel||dstr(new Date());
updateSchedDateVis();
document.getElementById('sModal').hidden=false;}
function updateSchedDateVis(){document.getElementById('sDateWrap').hidden=document.getElementById('sDaily').checked;}
function saveSchedItem(){
var label=document.getElementById('sLabel').value.trim();
if(!label){toast('Write what it is');return;}
var t=document.getElementById('sTime').value||'';
var daily=document.getElementById('sDaily').checked;
var d=daily?'':document.getElementById('sDate').value;
if(!daily&&!d){toast('Pick a date');return;}
S.sched.push({id:Date.now(),label:label,t:t,rep:daily?'daily':'date',d:d,notes:document.getElementById('sNotes').value.trim()});
saveS();document.getElementById('sModal').hidden=true;renderSchedule();toast('Added to schedule');}
function showTab(name){['Log','History','Schedule','Settings'].forEach(function(n){document.getElementById('tab'+n).classList.toggle('on',n===name);document.getElementById('view'+n).hidden=(n!==name);});
if(name==='History')renderHistory();if(name==='Schedule')renderSchedule();if(name==='Settings')fillSettings();}

document.getElementById('aideChip').addEventListener('click',pickAide);
document.getElementById('tabLog').addEventListener('click',function(){showTab('Log');});
document.getElementById('tabHistory').addEventListener('click',function(){showTab('History');});
document.getElementById('tabSettings').addEventListener('click',function(){showTab('Settings');});
document.getElementById('tabSchedule').addEventListener('click',function(){showTab('Schedule');});
document.getElementById('addSched').addEventListener('click',openSchedForm);
document.getElementById('sCancel').addEventListener('click',function(){document.getElementById('sModal').hidden=true;});
document.getElementById('sDaily').addEventListener('change',updateSchedDateVis);
document.getElementById('sSave').addEventListener('click',saveSchedItem);
document.getElementById('fPhotoBtn').addEventListener('click',pickPhoto);
document.getElementById('fPhoto').addEventListener('change',onPhotoPicked);
document.getElementById('fPhoto2Btn').addEventListener('click',pickPhoto2);
document.getElementById('fPhoto2').addEventListener('change',onPhotoPicked2);
document.getElementById('fCancel').addEventListener('click',closeForm);
document.getElementById('fSave').addEventListener('click',saveEntry);
document.getElementById('saveSettings').addEventListener('click',saveSettings);
document.getElementById('shareSummary').addEventListener('click',doShare);
document.getElementById('copySummary').addEventListener('click',doCopy);
document.getElementById('exportData').addEventListener('click',exportData);
document.getElementById('wipeData').addEventListener('click',wipeData);
document.getElementById('enableReminders').addEventListener('click',enableReminders);

openDB().then(loadEntries).then(function(){renderChip();renderDash();setInterval(function(){renderDash();checkDue();},30000);checkDue();}).catch(function(){document.getElementById('dashboard').innerHTML='<div class="empty">Could not open storage on this browser.</div>';});
</script>
