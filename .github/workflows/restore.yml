name: Restore decoded page
on: push
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode encoded page if needed
        run: |
          if head -c 12 v2/index.html | grep -q PCFET0NUWVBF; then
            base64 -d v2/index.html > /tmp/page.html
            cp /tmp/page.html v2/index.html
            git config user.name "restore-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add v2/index.html
            git commit -m "Restore v2 page from encoded copy"
            git push
          else
            echo "already decoded, nothing to do"
          fi
