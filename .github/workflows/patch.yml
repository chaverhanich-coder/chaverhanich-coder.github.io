name: Apply page patch
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch if needed
        run: |
          echo  | base64 -d > /tmp/p.patch
          if git apply --check /tmp/p.patch 2>/dev/null; then
            git apply /tmp/p.patch
            git config user.name "patch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add v2/index.html
            git commit -m "Check-offs remember which day they were for"
            git push
          else
            echo "patch already applied"
          fi
